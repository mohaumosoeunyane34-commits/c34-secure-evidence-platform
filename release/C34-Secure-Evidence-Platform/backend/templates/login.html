<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C34 Officer Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #080b10;
            color: #f1f1f1;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: #0d121a;
            border: 1px solid #26303d;
            border-radius: 14px;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
            letter-spacing: 3px;
        }

        p {
            color: #8995a3;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            border: 1px solid #303b49;
            background: #080b10;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1d78d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }

        #message {
            margin-top: 15px;
            color: #ffcc66;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>CANNIBAL 34</h1>

    <p>Secure Evidence Platform — Officer Login</p>

    <form id="loginForm">

        <label for="badge">Badge Number</label>

        <input
            id="badge"
            type="text"
            placeholder="C34-001"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            SECURE LOGIN
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const badge = document.getElementById("badge").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Authenticating...";

    try {

        const response = await fetch("/api/officer/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                badge_number: badge,
                password: password
            })
        });

        const data = await response.json();

        if (!data.success) {
            message.textContent =
                data.message || "Login failed.";
            return;
        }

        message.textContent = "Login successful.";

        window.location.href = "/dashboard";

    } catch (error) {

        message.textContent =
            "Unable to connect to C34 platform.";

        console.error(error);
    }

});

</script>

</body>
</html>
